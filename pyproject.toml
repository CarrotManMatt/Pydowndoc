[project]
name = "Pydowndoc"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Matt Norton", email = "matt@carrotmanmatt.com" }]
keywords = [
    "AsciiDoc",
    "Hatch",
    "Hatchling",
    "Markdown",
    "Python",
    "README",
    "build",
    "converter",
    "documentation",
    "metadata",
    "packaging",
    "pypi",
    "pyproject.toml"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Hatch",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed"
]
dependencies = [
    "hatchling",
    "typed_classproperties>=1.3",
    "typing-extensions>=4.16; python_version < '3.15'",
]
optional-dependencies = { "bin" = ["Pydowndoc-bin"] }
dynamic = ["description", "readme", "version"]

[project.urls]
Issues = "https://github.com/CarrotManMatt/Pydowndoc/issues"
Releases = "https://github.com/CarrotManMatt/Pydowndoc/releases"
Repository = "https://github.com/CarrotManMatt/Pydowndoc"

[project.entry-points.hatch]
downdoc-readme = "pydowndoc.hatch_hooks"

[dependency-groups]
dev = [
    { include-group = "lint-format" },
    { include-group = "pre-commit" },
    { include-group = "test" },
    { include-group = "type-check" }
]
build = ["hatch", "pip"]
build-dev = ["auditwheel", "packaging", "setuptools-scm", { include-group = "build" }]
lint-format = [
    "flake8-carrot>=0.1.2; python_version >= '3.14'",
    "flake8-pyproject>=1.2; python_version >= '3.14'",
    "ruff>=0.17"
]
package-analysis = ["pyroma>=5.0.1"]
pre-commit = ["prek>=0.5.3"]
test = []
type-check = ["ty>=0.0.99"]

[build-system]
requires = [
    "hatch-docstring-description",
    "hatch-vcs",
    "hatchling",
    "typing-extensions>=4.5.0; python_version < '3.12'"
]
build-backend = "hatchling.build"

[tool.flake8]
ignore = ["CAR110", "CAR163"]
select = ["CAR"]
extend_exclude = [".venv/"]
require_plugins = ["flake8-carrot"]

[tool.hatch.build]
only-packages = true

[tool.hatch.build.targets.sdist]
artifacts = ["README.adoc", "!local/**"]

[tool.hatch.metadata.hooks]
custom = { readme-path = "README.adoc" }
docstring-description = {}

[tool.hatch.version]
raw-options = { local_scheme = "no-local-version", version_scheme = "python-simplified-semver" }
source = "vcs"

[tool.ruff]
indent-width = 4
line-length = 95
output-format = "concise"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
external = ["CAR"]
ignore = [
    "C90",
    "COM812",
    "COM819",
    "CPY",
    "D107",
    "D206",
    "D212",
    "FA",
    "ICN001",
    "INP001",
    "ISC001",
    "ISC002",
    "N806",
    "PIE808",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "S603",
    "SIM910",
    "TD002",
    "TD003",
    "UP037",
    "W191"
]
select = ["ALL", "D204", "D213", "D401"]
task-tags = ["BUG", "DONE", "FIXME", "HACK", "IDEA", "ISSUE", "NOBUG", "NOTE", "REQ", "TODO"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["abc", "date", "datetime", "functools", "itertools", "re", "regex"]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = []
quote-annotations = true
strict = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "typed_classproperties.cached_classproperty",
    "typed_classproperties.classproperty"
]
extend-ignore-names = [
    "BROKEN_*_MESSAGE",
    "INVALID_*_MESSAGE",
    "NO_*_MESSAGE",
    "OUTPUT_CONVERSION_TO_STRING"
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 95

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = [
    "typed_classproperties.cached_classproperty",
    "typed_classproperties.classproperty"
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "int", "str"]
max-args = 8
max-branches = 19
max-returns = 10

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.per-file-target-version]
"Pydowndoc-bin/**" = "py315"

[tool.tombi.format.rules]
indent-width = 4
line-width = 95

[tool.ty.src]
exclude = ["Pydowndoc-bin/"]

[tool.ty.rules]
blanket-ignore-comment = "error"
disjoint-cast = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
mismatched-sentinel-name = "warn"
missing-direct-dependency = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
redundant-condition-strict = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"
unused-ignore-comment = "error"

[tool.uv]
default-groups = ["dev"]
no-binary-package = ["Pydowndoc-bin"]
no-build = true
package = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
required-version = ">=0.12.20"
trusted-publishing = "always"

[tool.uv.sources]
Pydowndoc-bin = { path = "Pydowndoc-bin/" }

[[tool.uv.index]]
explicit = true
name = "Test-PyPI"
publish-url = "https://test.pypi.org/legacy/"
url = "https://test.pypi.org/simple/"
